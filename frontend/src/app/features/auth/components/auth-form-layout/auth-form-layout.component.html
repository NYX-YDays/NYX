<div class="auth-form d-flex justify-content-center bg-primary bg-gradient h-100">
  <img alt="background"
       ngSrc="/images/auth/background.jpg"
       class="auth-form-bg object-fit-cover position-absolute w-100 h-100"
       fill />
  <div class="auth-form-container d-flex align-items-center w-100 z-1 bg-white">
    <div class="px-4 px-md-5 py-5 overflow-auto w-100 mh-100">
      <div class="d-flex flex-column justify-content-center align-items-center gap-4">

        <!-- Title -->
        <h2 class="mb-0">{{ title }}</h2>

        <!-- Content -->
        <ng-content/>

        <div class="d-flex flex-column align-items-center gap-3 w-100">

          <!-- Submit button -->
          <button (click)="onSubmit.emit()"
                  [disabled]="isLoading || disableSubmitButton"
                  type="button"
                  class="btn btn-primary w-100">
            @if (isLoading) {
              <div class="spinner-grow spinner-grow-sm"></div>
            } @else {
              <i class="bi bi-box-arrow-in-left"></i>
            }
            {{ buttonSubmitText }}
          </button>

          <!-- Extra link -->
          @if (extraLinkText) {
            <a [routerLink]="extraLinkUri" class="btn-link small">{{ extraLinkText }}</a>
          }

        </div>

        <!-- Error message -->
        @if (errorMessage) {
          <div class="d-inline invalid-feedback w-auto">{{ errorMessage }}</div>
        }

      </div>
    </div>
  </div>
</div>
