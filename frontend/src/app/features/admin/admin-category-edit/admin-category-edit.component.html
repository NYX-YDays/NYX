<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>
        @if (isCreateMode) {
          {{ 'ADMIN.EDIT_CATEGORY.CREATE_TITLE' | translate }}
        } @else {
          {{ 'ADMIN.EDIT_CATEGORY.EDIT_TITLE' | translate }}
        }
      </h3>
      <button class="btn-close" (click)="onClose()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="categoryTitle">{{ 'ADMIN.EDIT_CATEGORY.TITLE_LABEL' | translate }} <span class="required">*</span></label>
        <input 
          type="text" 
          id="categoryTitle"
          [(ngModel)]="title"
          [placeholder]="'ADMIN.EDIT_CATEGORY.TITLE_PLACEHOLDER' | translate"
          class="form-control"
          [disabled]="isSaving"
          autofocus>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()" [disabled]="isSaving">
        {{ 'ADMIN.EDIT_CATEGORY.CANCEL' | translate }}
      </button>
      <button class="btn-save" (click)="onSave()" [disabled]="isSaving">
        @if (isSaving) {
          <span class="spinner-small"></span>
          {{ 'ADMIN.EDIT_CATEGORY.SAVING' | translate }}
        } @else {
          <i class="bi bi-check-lg"></i>
          {{ 'ADMIN.EDIT_CATEGORY.SAVE' | translate }}
        }
      </button>
    </div>
  </div>
</div>
