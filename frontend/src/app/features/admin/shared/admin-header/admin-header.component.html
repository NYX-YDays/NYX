<header class="admin-header">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <i class="bi bi-shield-check me-3 fs-3"></i>
        <h1 class="mb-0">{{ 'ADMIN.DASHBOARD.TITLE' | translate }}</h1>
      </div>
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-light" routerLink="/">
          <i class="bi bi-box-arrow-left me-2"></i>
          {{ 'ADMIN.DASHBOARD.BACK_TO_NYX' | translate }}
        </button>
        <div class="vr"></div>
        <span class="me-2">
          <i class="bi bi-person-circle me-2"></i>
          {{ currentUser?.firstName }} {{ currentUser?.lastName }}
        </span>
        <button class="btn btn-outline-light" (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i>
          {{ 'ADMIN.DASHBOARD.DISCONNECT' | translate }}
        </button>
      </div>
    </div>
  </div>
</header>
